# 変更されたファイルから、影響する製品のラベルを付ける（release-label-check.yml が使う）。
# ラベル名は VERSION ファイルの製品名と同じにする。
# 製品のディレクトリ以外の変更は共有扱いで、両方の製品に影響するとみなす。
# ただし、どの製品にも影響しないファイル（VERSION、README.md、docs/）は除く。
product-a:
  - changed-files:
      - all-globs-to-any-file: ['**', '!ProductB/**', '!VERSION', '!README.md', '!docs/**']

product-b:
  - changed-files:
      - all-globs-to-any-file: ['**', '!ProductA/**', '!VERSION', '!README.md', '!docs/**']
