# 変更が影響する製品を判定する（release-label-check.yml と ci.yml の dorny/paths-filter が使う）。
# 製品ごとに、その製品のリリースに入るパスを書く（フィルタ名は VERSION ファイルの製品名と同じにする）。
# 複数の製品で共有するパスは、使う製品すべてに書く。
# どこにも書かれていないパスの変更は、すべての製品に影響するとみなす。

# すべての製品に共通するパス
common: &common
  - 'Shared/**'

product-a: &product-a
  - *common
  - 'ProductA/**'
  - 'SharedAB/**'
  - 'SharedAC/**'

product-b: &product-b
  - *common
  - 'ProductB/**'
  - 'SharedAB/**'

product-c: &product-c
  - *common
  - 'ProductC/**'
  - 'SharedAC/**'

# どの製品にも影響しないファイル（自動化やテンプレートの .github も、どの製品のリリースにも入らない。
# CI の設定を変えたときに全製品のテストを動かすのは、ci.yml の側で判定している）
none: &none
  - 'VERSION'
  - 'README.md'
  - 'docs/**'
  - '.github/**'
  - 'high'

# どこにも書かれていないパスを見つけるためのフィルタ。製品を足したら listed にも足す。
listed: [*product-a, *product-b, *product-c, *none]
all: ['**']
