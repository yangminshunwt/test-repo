name: Cherry-Pick

# マージされた PR の変更を、リリースラベルが表す範囲のリリースブランチに cherry-pick する PR を作る。
# pull_request_target はマージ先に関係なく既定ブランチ（main）のワークフローとスクリプトで動く。PR のコードは実行しない。
on:
  pull_request_target:
    types: [closed]
    branches:
      - main
      - 'release/**'
  # 失敗した行き先の原因を直したあとに、手でやり直す（Release Preparation と Hotfix Preparation も、新しいブランチのために実行する）
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the merged PR to cherry-pick
        required: true
        type: number

permissions:
  contents: read

env:
  PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}

# 同じ PR の実行は順番に動かす（行き先を決めてから cherry-pick するまでの間に、別の実行が同じ行き先へ PR を作らないように）
concurrency:
  group: cherry-pick-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cherry-pick:
    name: cherry-pick
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    # 行き先を決めるまでは GITHUB_TOKEN で動かし、App のトークンは行き先があるときだけ作る（行き先のない PR は App に頼らない）
    permissions:
      contents: write # 前の実行の残りの cherry-pick のブランチを消す
      pull-requests: write # 失敗を元の PR へコメントする（App のトークンを作れなかったときも知らせるため GITHUB_TOKEN で）
    steps:
      # スクリプトと、変更がもう入っているかを確かめるためのすべての履歴（リリースブランチも）。
      # 途中のステップが失敗しても失敗を知らせられるよう、最初に取る
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: select
        name: Select targets
        uses: actions/github-script@v9
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          script: |
            const { selectTargets } = require('./.github/scripts/cherry-pick.js')
            await selectTargets({ github, context, core })

      # GITHUB_TOKEN で作った PR ではチェックが走らないので、GitHub App のトークンを使う
      - id: app-token
        if: steps.select.outputs.targets != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write # .github/workflows の変更も cherry-pick するため

      # backport-action は作業場所のブランチを切り替えるので、スクリプトとは別の場所に取る
      - if: steps.select.outputs.branches != ''
        uses: actions/checkout@v7
        with:
          path: backport-work
          token: ${{ steps.app-token.outputs.token }}

      - id: backport
        if: steps.select.outputs.branches != ''
        uses: korthout/backport-action@0ebd44f9c79a4a0a171200dcdcceec3ed9ca732f # v4.7.1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          github_workspace: ${{ github.workspace }}/backport-work
          source_pr_number: ${{ env.PR_NUMBER }}
          target_branches: ${{ steps.select.outputs.branches }}
          label_pattern: '' # 行き先は select で決めたものだけにする
          branch_name: cherry-pick-${pull_number}-to-${target_branch} # rules.js の cherryPickBranch・parseCherryPickBranch と同じ形
          # ${...} は、タイトルと本文のそれぞれで最初の 1 か所しか置き換わらないので、同じものを 2 回書かない
          pull_title: '🍒 [#${pull_number} → ${target_branch}] ${pull_title}'
          pull_description: |-
            #${pull_number} を `${target_branch}` に cherry-pick する PR です。
          copy_assignees: true # 元の PR の担当者を引き継ぐ（担当者がいなければ付けない）
          comment_style: summary
          # コンフリクトしたら、コンフリクトを含んだままの draft PR を作り、解き方を元の PR にコメントする
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'

      - name: Label cherry-pick pull requests
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        uses: actions/github-script@v9
        env:
          TARGETS: ${{ steps.select.outputs.targets }}
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { labelPullRequests } = require('./.github/scripts/cherry-pick.js')
            await labelPullRequests({ github, context })

      - name: Report failures
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          JOB_STATUS: ${{ job.status }}
          BACKPORT_OUTCOME: ${{ steps.backport.outcome }}
          WAS_SUCCESSFUL: ${{ steps.backport.outputs.was_successful }}
          RESULTS: ${{ steps.backport.outputs.was_successful_by_target }}
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          script: |
            const { reportFailures } = require('./.github/scripts/cherry-pick.js')
            await reportFailures({ github, context, core })
