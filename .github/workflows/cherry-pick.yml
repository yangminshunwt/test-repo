name: Cherry-Pick

# マージされた PR の変更を、リリースラベルが表す範囲のリリースブランチに cherry-pick する PR を作る。
on:
  pull_request_target:
    types: [closed]
    branches:
      - main
      - 'release/**'
  # 失敗した行き先の原因を直したあとに、手でやり直す
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the merged PR to cherry-pick
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

env:
  PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}

# 同じ PR の実行は順番に動かす（行き先を決めてから cherry-pick するまでの間に、別の実行が同じ行き先へ PR を作らないように）
concurrency:
  group: cherry-pick-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cherry-pick:
    name: cherry-pick
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    # App の秘密鍵は Environment（automation-app）に置き、main と release/** で動くときだけ読めるようにしている
    # （どちらも PR でしか変えられないので、PR でマージされ、必須チェックを通ったワークフローだけが秘密鍵を使える。
    # リリースブランチを作れる管理者は、そのブランチのワークフローで秘密鍵を使える）。
    # デプロイの記録は作らない（秘密鍵を読むためだけに使う）。pull_request_target は main として判定される。
    # main と release/** 以外から Run workflow すると、この job は始まらない
    environment:
      name: automation-app
      deployment: false
    steps:
      # スクリプトを取得する。行き先は API で調べるので、Git の全履歴は不要。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: prepare
        name: Prepare cherry-pick
        uses: actions/github-script@v9
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          script: |
            const { prepare } = require('./.github/scripts/cherry-pick/workflow.ts')
            await prepare({ github, context, core })

      # GITHUB_TOKEN で作った PR ではチェックが走らないので、GitHub App のトークンを使う
      - id: app-token
        if: steps.prepare.outputs.targets != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write # .github/workflows の変更も cherry-pick するため

      # backport-action は作業場所のブランチを切り替えるので、スクリプトとは別の場所に取る
      - if: steps.prepare.outputs.targets != ''
        uses: actions/checkout@v7
        with:
          path: backport-work
          token: ${{ steps.app-token.outputs.token }}

      - id: backport
        if: steps.prepare.outputs.targets != ''
        uses: korthout/backport-action@ad272ff24e4a8593bf18a951a154ae6af93b26b8 # v5.0.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          github_workspace: ${{ github.workspace }}/backport-work
          source_pr_number: ${{ env.PR_NUMBER }}
          target_branches: ${{ steps.prepare.outputs.targets }}
          label_pattern: '' # 行き先は prepare で決めたものだけにする
          branch_name: cherry-pick-${pull_number}-to-${target_branch} # rules.ts の cherryPickBranch・parseCherryPickBranch と同じ形
          pull_title: '🍒 [#${pull_number} → ${target_branch}] ${pull_title}'
          pull_description: |-
            #${pull_number} を `${target_branch}` に cherry-pick する PR です。
          copy_assignees: true # 元の PR の担当者を引き継ぐ（担当者がいなければ付けない）
          comment_style: summary
          # コンフリクトしたら、コンフリクトを含んだままの draft PR を作り、解き方をその draft PR にコメントする（元の PR のコメントにはリンクだけが出る）
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'

      - name: Label cherry-pick pull requests
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        uses: actions/github-script@v9
        env:
          TARGETS: ${{ steps.prepare.outputs.targets }}
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { label } = require('./.github/scripts/cherry-pick/workflow.ts')
            await label({ github, context, core })

      - name: Check backport result
        # 部分失敗や処理前の終了ではステップが成功になることもあるので、action の集約結果も見る。
        if: >-
          ${{ !cancelled() && steps.backport.outcome == 'success' &&
              steps.backport.outputs.was_successful != 'true' }}
        run: |
          echo "::error::cherry-pick を終えられませんでした。backport-action のコメントと実行の記録を確かめてください。"
          exit 1
