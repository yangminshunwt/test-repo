name: Cherry-Pick

# マージされた PR の変更を、リリースラベルが表す範囲のリリースブランチに cherry-pick する PR を作る。
# pull_request_target はマージ先に関係なく既定ブランチ（main）のワークフローとスクリプトで動く。PR のコードは実行しない。
on:
  pull_request_target:
    types: [closed]
    branches:
      - main
      - 'release/**'
  # 失敗した行き先の原因を直したあとや、リリースブランチを作ったあとに、手でやり直す
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the merged PR to cherry-pick
        required: true
        type: number

permissions:
  contents: read

env:
  PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}

# 同じ PR の実行は順番に処理する（重なると、もう一方が作ったばかりのブランチを消してしまう）。
# 待っている実行が後の実行に置き換えられても、後の実行が今の状態から決め直すので困らない（必須チェックでもない）
concurrency:
  group: cherry-pick-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  targets:
    name: find cherry-pick targets
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # 行き先を決められないときに元の PR へコメントする（PR へのコメントには pull-requests の権限が要る）
    outputs:
      all_branches: ${{ steps.targets.outputs.all_branches }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: targets
        uses: actions/github-script@v9
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          script: |
            const { findTargets } = require('./.github/scripts/cherry-pick.js')
            await findTargets({ github, context, core })

      - name: Report a failure
        if: ${{ failure() }}
        uses: actions/github-script@v9
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          script: |
            const { reportTargetsFailure } = require('./.github/scripts/cherry-pick.js')
            await reportTargetsFailure({ github, context })

  cherry-pick:
    name: cherry-pick
    needs: targets
    if: needs.targets.outputs.all_branches != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # 失敗を元の PR へコメントする（App のトークンを作れなかったときも知らせるため GITHUB_TOKEN で）
    env:
      TARGETS: ${{ needs.targets.outputs.all_branches }}
    steps:
      # スクリプト用。途中のステップが失敗しても失敗を知らせられるよう、最初に取る
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GITHUB_TOKEN で作った PR ではチェックが走らないので、GitHub App のトークンを使う
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CHERRY_PICK_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHERRY_PICK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write # .github/workflows の変更も cherry-pick するため

      # backport-action は作業場所のブランチを切り替えるので、スクリプトとは別の場所に取る
      - uses: actions/checkout@v7
        with:
          path: backport-work
          token: ${{ steps.app-token.outputs.token }}

      # Re-run でも今の状態で決めるよう、行き先とまだ cherry-pick の PR がない行き先は、このジョブの中で決め直す
      - id: pending
        name: Select targets without cherry-pick pull requests
        uses: actions/github-script@v9
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { selectPending } = require('./.github/scripts/cherry-pick.js')
            await selectPending({ github, context, core })

      - name: Wait until GitHub links the merge commit to the PR
        if: steps.pending.outputs.branches != ''
        uses: actions/github-script@v9
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          script: |
            const { waitForMergeLink } = require('./.github/scripts/cherry-pick.js')
            await waitForMergeLink({ github, context, core })

      - id: backport
        if: steps.pending.outputs.branches != ''
        uses: korthout/backport-action@0ebd44f9c79a4a0a171200dcdcceec3ed9ca732f # v4.7.1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          github_workspace: ${{ github.workspace }}/backport-work
          source_pr_number: ${{ env.PR_NUMBER }}
          target_branches: ${{ steps.pending.outputs.branches }}
          label_pattern: '' # 行き先は targets ジョブと pending ステップで決めたものだけにする
          branch_name: cherry-pick-${pull_number}-to-${target_branch} # release-labels.js の cherryPickBranch・parseCherryPickBranch と同じ形
          # ${...} は、タイトルと本文のそれぞれで最初の 1 か所しか置き換わらないので、同じものを 2 回書かない
          pull_title: '🍒 [#${pull_number} → ${target_branch}] ${pull_title}'
          pull_description: |-
            #${pull_number} を `${target_branch}` に cherry-pick する PR です。
          copy_assignees: true # 元の PR の担当者を引き継ぐ（担当者がいなければ付けない）
          comment_style: summary
          # コンフリクトしたら、コンフリクトを含んだままの draft PR を作る（解き方は draft の PR にコメントされる）
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'

      - id: label
        name: Label cherry-pick pull requests
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        uses: actions/github-script@v9
        env:
          TARGETS: ${{ steps.pending.outputs.targets }} # 決め直した行き先（リリース済みの行き先は除いてある）
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { labelPullRequests } = require('./.github/scripts/cherry-pick.js')
            await labelPullRequests({ github, context, core })

      - name: Report failures
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          APP_TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          JOB_STATUS: ${{ job.status }}
          PENDING_BRANCHES: ${{ steps.pending.outputs.branches }}
          BACKPORT_OUTCOME: ${{ steps.backport.outcome }}
          WAS_SUCCESSFUL: ${{ steps.backport.outputs.was_successful }}
          RESULTS: ${{ steps.backport.outputs.was_successful_by_target }}
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          script: |
            const { reportFailures } = require('./.github/scripts/cherry-pick.js')
            await reportFailures({ github, context, core })
