name: CI

on:
  pull_request:
    # マージ先を変えたときも、今のマージ先との差分で判定し直す（前のマージ先で飛ばした結果を残さない）
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# 影響する製品のテストだけを動かす。テストは PR の先頭で動かす（ルールセットで「マージ先の最新を取り込んでから」スカッシュで
# マージするので、マージできるときは PR の先頭の中身がマージ後の中身と同じになる）。
# 必須チェックは、最後の ci だけ。飛ばしたテストのジョブは成功の扱いで、判定やテストが失敗・取り消しなら ci が失敗する
# （製品を足しても、ルールセットの必須チェックは変えなくてよい）。
jobs:
  changes:
    name: find affected products
    # マージした PR は、もうマージも再オープンもできないのでテストしない（ほかのジョブも飛ばされ、ci は成功の扱いになる）
    if: ${{ !github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # 今のマージ先を API で取り直す
    outputs:
      matched: ${{ steps.paths.outputs.changes }}
      all_products: ${{ steps.paths.outputs.all_count != steps.paths.outputs.listed_count || steps.scripts.outputs.ci == 'true' }}
      scripts: ${{ steps.scripts.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # スクリプトと製品のパス設定（.github の直下のファイル）は、このワークフローと同じ版（テスト用のマージコミット）のものを使う
      # （PR の先頭が古いと、ワークフローと食い違うため）。PR の先頭は、変更とマージ後の中身を調べるデータとしてだけ使う
      - uses: actions/checkout@v7
        with:
          path: .automation
          sparse-checkout: .github/scripts
          persist-credentials: false

      - id: base
        uses: actions/github-script@v9
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          script: |
            const { findBase } = require('./.automation/.github/scripts/release-label-check.js')
            await findBase({ github, context, core })

      # 影響する製品は、ラベルのチェックと同じ設定（.github/product-paths.yml）で決める。
      # 製品の設定に書かれていないパスの変更（all と listed の件数が違う）があれば、すべての製品のテストを動かす。
      - id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .automation/.github/product-paths.yml
          base: ${{ steps.base.outputs.base_sha }}
          token: ''

      - id: scripts
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.base.outputs.base_sha }}
          token: ''
          filters: |
            scripts:
              - '.github/**'
              - 'VERSION'
            # CI の設定そのものを変えたときは、すべての製品のテストを動かして確かめる
            ci:
              - '.github/workflows/ci.yml'

  unit-test-product-a:
    name: unit test for product-a
    needs: changes
    if: needs.changes.outputs.all_products == 'true' || contains(needs.changes.outputs.matched, '"product-a"')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run tests
        run: test ! -e ProductA/FAIL

  unit-test-product-b:
    name: unit test for product-b
    needs: changes
    if: needs.changes.outputs.all_products == 'true' || contains(needs.changes.outputs.matched, '"product-b"')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run tests
        run: test ! -e ProductB/FAIL

  # 自動化のスクリプトとワークフロー、VERSION（製品名がそろっているかを確かめる）が変わったときだけ動かす
  script-test:
    name: script test
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run tests
        run: node --test .github/scripts/*.test.js

  ci:
    name: ci
    needs: [changes, unit-test-product-a, unit-test-product-b, script-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
