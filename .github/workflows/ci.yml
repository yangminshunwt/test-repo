name: CI

on:
  pull_request:
    # マージ先を変えたときも、今のマージ先との差分で判定し直す（前のマージ先で飛ばした結果を残さない）
    types: [opened, synchronize, reopened, edited]
  # マージキューでも同じ必須チェックを出す。
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# 差分の判定とテストは、イベントの同じマージコミット（キューではマージグループ）で動かす。
# 必須チェックは、最後の ci だけ。飛ばしたテストのジョブは成功の扱いで、判定やテストが失敗・取り消しなら ci が失敗する
# （製品を足しても、ルールセットの必須チェックは変えなくてよい）。
jobs:
  changes:
    name: find affected products
    # マージした PR は、もうマージも再オープンもできないのでテストしない（ほかのジョブも飛ばされ、ci は成功の扱いになる）。
    # マージキューでは必ずテストする
    if: github.event_name == 'merge_group' || !github.event.pull_request.merged
    runs-on: ubuntu-latest
    outputs:
      matched: ${{ steps.paths.outputs.changes }}
      all_products: ${{ steps.paths.outputs.all_count != steps.paths.outputs.listed_count || steps.scripts.outputs.ci == 'true' }}
      scripts: ${{ steps.scripts.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: base
        name: Find comparison base
        uses: actions/github-script@v9
        with:
          script: |
            const mergeGroup = context.payload.merge_group
            let baseSha

            if (mergeGroup) {
              // マージキュー：GitHub が通知した、今回のマージグループの比較基準を使う。
              baseSha = mergeGroup.base_sha
            } else {
              // 通常の PR：HEAD は GitHub が作ったテスト用マージコミット。
              // HEAD^1 はその第 1 親、つまりこの PR をマージする前のマージ先のコミット。
              const { git } = require('./.github/scripts/github-helpers.ts')
              baseSha = git('rev-parse', 'HEAD^1')
            }

            // 後のステップが steps.base.outputs.base_sha で参照できるようにする。
            core.setOutput('base_sha', baseSha)

      # 影響する製品は、ラベルのチェックと同じ設定（.github/product-paths.yml）で決める。
      # 製品の設定に書かれていないパスの変更（all と listed の件数が違う）があれば、すべての製品のテストを動かす。
      - id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/product-paths.yml
          base: ${{ steps.base.outputs.base_sha }}
          token: ''

      - id: scripts
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.base.outputs.base_sha }}
          token: ''
          filters: |
            scripts:
              - '.github/**'
              - 'VERSION'
            # CI の設定そのものを変えたときは、すべての製品のテストを動かして確かめる
            ci:
              - '.github/workflows/ci.yml'

  unit-test-product-a:
    name: unit test for product-a
    needs: changes
    if: needs.changes.outputs.all_products == 'true' || contains(needs.changes.outputs.matched, '"product-a"')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run tests
        run: test ! -e ProductA/FAIL

  unit-test-product-b:
    name: unit test for product-b
    needs: changes
    if: needs.changes.outputs.all_products == 'true' || contains(needs.changes.outputs.matched, '"product-b"')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run tests
        run: test ! -e ProductB/FAIL

  # 自動化のスクリプトとワークフロー、VERSION（製品名がそろっているかを確かめる）が変わったときだけ動かす
  script-test:
    name: script test
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install type-check dependencies
        run: npm ci --prefix .github/scripts --ignore-scripts
      - name: Check TypeScript
        run: npm run typecheck --prefix .github/scripts
      - name: Run tests
        run: node --test .github/scripts/*.test.ts

  ci:
    name: ci
    needs: [changes, unit-test-product-a, unit-test-product-b, script-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
