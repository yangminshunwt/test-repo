name: CI

on:
  pull_request:
    # マージ先を変えたときも、今のマージ先との差分で判定し直す（前のマージ先で飛ばした結果を残さない）
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# 影響する製品のテストだけを動かす。飛ばすときは、ワークフローの paths ではなくジョブの if で飛ばす
# （if で飛ばしたジョブは必須チェックでも成功の扱いになるが、ワークフローごと動かないとチェックが待ちのまま残る）。
# テストは、今のマージ先の先頭と PR の先頭とのマージコミットで動かす（判定のジョブが待って決める）。
# 判定のジョブが成功しなかったとき（失敗・取り消し）は、テストのジョブを失敗にする（原因を片付けて、push か Re-run で決め直す）。
jobs:
  changes:
    name: find affected products
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter が PR の変更ファイルを API で取る
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      matched: ${{ steps.paths.outputs.changes }}
      all_products: ${{ steps.affected.outputs.all_products }}
      scripts: ${{ steps.affected.outputs.scripts }}
    steps:
      # マージ先を変えた直後でも今のマージ先でテストするよう、今のマージ先とのマージコミットができるまで待つ
      # （.github/scripts/merge-commit.js。ラベルのチェックと同じ）。待つスクリプトを読むためだけに、先に別の場所に取る
      - uses: actions/checkout@v7
        with:
          path: .wait-scripts
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Wait for the merge commit with the current base
        id: merge
        uses: actions/github-script@v9
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          script: |
            const { waitForMergeCommit } = require('./.wait-scripts/.github/scripts/merge-commit.js')
            await waitForMergeCommit({ github, context, core })

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.merge.outputs.sha }}
          persist-credentials: false

      # 影響する製品は、ラベルのチェックと同じ設定（.github/product-paths.yml）で決める。
      # テストのジョブは、製品のフィルタに当たったか、すべての製品に影響するとき（書かれていないパスや、上限で一覧が切れているかもしれないとき）に動かす。
      # 製品の一覧は PR の VERSION からは作らない（VERSION から製品の行が消えても、その製品のテストを飛ばさないため）
      - id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/product-paths.yml

      - id: scripts
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            scripts:
              - '.github/**'
              - 'VERSION'
            # CI の設定そのものを変えたときは、すべての製品のテストを動かして確かめる
            ci:
              - '.github/workflows/ci.yml'

      - id: affected
        uses: actions/github-script@v9
        env:
          MATCHED: ${{ steps.paths.outputs.changes }}
          ALL_FILE_COUNT: ${{ steps.paths.outputs.all_count }}
          LISTED_FILE_COUNT: ${{ steps.paths.outputs.listed_count }}
          SCRIPTS: ${{ steps.scripts.outputs.scripts }}
          CI_CHANGED: ${{ steps.scripts.outputs.ci }}
        with:
          script: |
            const { MAX_LISTED_FILES, reasonForAllProducts } = require('./.github/scripts/release-labels.js')
            const allFileCount = Number.parseInt(process.env.ALL_FILE_COUNT, 10)
            const reason = reasonForAllProducts({ allFileCount, listedFileCount: Number.parseInt(process.env.LISTED_FILE_COUNT, 10) })
            core.info(`当たったフィルタ：${process.env.MATCHED}${reason ? `（${reason}）` : ''}`)
            if (process.env.CI_CHANGED === 'true') core.info('CI の設定が変わったので、すべての製品のテストを動かします。')
            core.setOutput('all_products', String(reason !== null || process.env.CI_CHANGED === 'true'))
            // 一覧が上限で切れているかもしれないときは、スクリプトの変更も見落としているかもしれないので動かす
            core.setOutput('scripts', String(process.env.SCRIPTS === 'true' || allFileCount >= MAX_LISTED_FILES))

  unit-test-product-a:
    name: unit test for product-a
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.all_products == 'true' || contains(needs.changes.outputs.matched, '"product-a"')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Stop when the tests to run could not be decided
        # 取り消された実行でも動くよう always() を付ける（付けないと、このステップが飛ばされてテストが成功の扱いになる）
        if: ${{ always() && needs.changes.result != 'success' }}
        run: |
          echo "::error::どのテストを動かすかを決められませんでした（find affected products が ${{ needs.changes.result }}）。find affected products のエラーを見て対応してください（コンフリクトなら解消して push、取り消しや一時的なエラーなら Re-run）。"
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: Run tests
        run: test ! -e ProductA/FAIL

  unit-test-product-b:
    name: unit test for product-b
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.all_products == 'true' || contains(needs.changes.outputs.matched, '"product-b"')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Stop when the tests to run could not be decided
        # 取り消された実行でも動くよう always() を付ける（付けないと、このステップが飛ばされてテストが成功の扱いになる）
        if: ${{ always() && needs.changes.result != 'success' }}
        run: |
          echo "::error::どのテストを動かすかを決められませんでした（find affected products が ${{ needs.changes.result }}）。find affected products のエラーを見て対応してください（コンフリクトなら解消して push、取り消しや一時的なエラーなら Re-run）。"
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: Run tests
        run: test ! -e ProductB/FAIL

  # 自動化のスクリプトとワークフロー、VERSION（製品名がそろっているかを確かめる）が変わったときだけ動かす
  script-test:
    name: script test
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.scripts == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Stop when the tests to run could not be decided
        # 取り消された実行でも動くよう always() を付ける（付けないと、このステップが飛ばされてテストが成功の扱いになる）
        if: ${{ always() && needs.changes.result != 'success' }}
        run: |
          echo "::error::どのテストを動かすかを決められませんでした（find affected products が ${{ needs.changes.result }}）。find affected products のエラーを見て対応してください（コンフリクトなら解消して push、取り消しや一時的なエラーなら Re-run）。"
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - name: Run tests
        run: node --test .github/scripts/release-labels.test.js .github/scripts/products.test.js
