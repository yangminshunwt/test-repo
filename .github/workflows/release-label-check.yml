name: Release Label Check

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    # ラベルの付け外しやマージ先の変更でもチェックし直す
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# concurrency で前の実行を取り消すことはしない。PR の作成とラベルの追加のように続けて起きたイベントで、
# あとに作られた実行のほうが取り消されると、その結果（取り消し）が必須チェックに使われてマージできなくなるため。
# どの実行もその時点のマージ先とラベルを取り直して判定するので、取り消さなくても最後に作られた実行の結果が正しくなる。

permissions:
  contents: read

jobs:
  release-label-check:
    name: release label check
    # 閉じた PR（マージ後にラベルを直したときなど）はもうマージしないので、チェックしない
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # PR の先頭を、マージ先との分かれ目と今あるリリースブランチを読むために、すべての履歴（ほかのブランチも）つきで取る
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: base
        uses: actions/github-script@v9
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          script: |
            const { findBase } = require('./.github/scripts/release-label-check.js')
            await findBase({ github, context, core })

      # 分かれ目から PR の先頭までの変更を git で探す（token を空にすると API ではなく git を使い、変更ファイルの件数の上限もない）
      - id: products
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/product-paths.yml
          base: ${{ steps.base.outputs.base_sha }}
          token: ''

      - name: Check release labels
        uses: actions/github-script@v9
        env:
          BASE_REF: ${{ steps.base.outputs.base_ref }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          LABELS: ${{ steps.base.outputs.labels }}
          AFFECTED_PRODUCTS: ${{ steps.products.outputs.changes }}
          ALL_FILE_COUNT: ${{ steps.products.outputs.all_count }}
          LISTED_FILE_COUNT: ${{ steps.products.outputs.listed_count }}
        with:
          script: |
            const { check } = require('./.github/scripts/release-label-check.js')
            await check({ core })
