name: Release Label Check

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    # ラベルの付け外しやマージ先の変更でもチェックし直す
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  # マージキューでも同じ必須チェックを出す。
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  release-label-check:
    name: release label check
    # マージ済み PR のラベル変更では実行しない。
    if: github.event_name == 'merge_group' || !github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      # 再実行でも現在のテスト用マージコミットを取る。キューではイベントの合成済みコミットを使う。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'merge_group' && github.sha || format('refs/pull/{0}/merge', github.event.pull_request.number) }}
          fetch-depth: 0
          persist-credentials: false

      - id: base
        name: Read pull request and base
        uses: actions/github-script@v9
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          script: |
            const { findBase } = require('./.github/scripts/release-label-check.ts')
            await findBase({ github, context, core, mergedCheckout: true })

      # token を空にして、ファイル数制限のある API ではなく git で差分を取る。
      - id: products
        name: Find affected products
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/product-paths.yml
          base: ${{ steps.base.outputs.base_sha }}
          token: ''

      - name: Check release labels
        uses: actions/github-script@v9
        env:
          BASE_REF: ${{ steps.base.outputs.base_ref }}
          BEFORE: ${{ steps.base.outputs.before }}
          LABELS: ${{ steps.base.outputs.labels }}
          AFFECTED_PRODUCTS: ${{ steps.products.outputs.changes }}
          ALL_FILE_COUNT: ${{ steps.products.outputs.all_count }}
          LISTED_FILE_COUNT: ${{ steps.products.outputs.listed_count }}
        with:
          script: |
            const { check } = require('./.github/scripts/release-label-check.ts')
            await check({ core })
