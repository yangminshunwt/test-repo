name: Release label check

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    # ラベルの付け外しやマージ先の変更でもチェックし直す
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: release-label-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-label-check:
    name: release label check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # マージ前の VERSION を読むため、マージコミットの親まで取る
          fetch-depth: 2
          persist-credentials: false

      - name: Find affected products
        id: products
        uses: dorny/paths-filter@v4
        with:
          filters: .github/product-paths.yml
          predicate-quantifier: some-with-excludes

      - name: Check release labels
        uses: actions/github-script@v9
        env:
          AFFECTED_PRODUCTS: ${{ steps.products.outputs.changes }}
        with:
          script: |
            const run = require('./.github/scripts/release-label-check.js')
            await run({ github, context, core })
