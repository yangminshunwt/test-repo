name: Release Label Recheck

# リリースラベルのチェックの結果は、PR のラベルとマージ先のほかに、マージ先の VERSION と今あるリリースブランチでも変わる。
# それらが変わったときは PR のイベントが起きないので、影響する開いている PR のチェックをやり直す（ラベルは変えない）。
# - リリースブランチを作った・削除した（create・delete）：main とリリースブランチに向けたすべての PR
# - main かリリースブランチの VERSION が変わった（push）：そのブランチに向けた PR
on:
  create:
  delete:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - VERSION

permissions:
  contents: read

jobs:
  recheck:
    name: recheck release labels
    if: github.event_name == 'push' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/'))
    runs-on: ubuntu-latest
    permissions:
      actions: write # ラベルのチェックの実行をやり直す
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/github-script@v9
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          script: |
            const { recheck } = require('./.github/scripts/release-label-check.ts')
            await recheck({ github, context, core })
