name: Tag Creation

# リリース手順を進める（開発ルールの「リリース手順」）。Use workflow from でリリースブランチを選んで実行する。
# - rc：リリース申請の前に、リリースブランチの先頭に次の rc タグ（<製品名>/vX.Y.Z-rc.N）を打つ
# - release：リリースの後に、リリースタグ（<製品名>/vX.Y.Z）を打ち、リリースブランチを削除する。
#   rc を打っていれば最後の rc と同じコミットに、打っていなければ commit に入力したリリースしたコミットに打つ
#   （ブランチの先頭は、リリースのあとにマージされたコミットで進んでいることがあるので使わない）
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Step to run (rc: before the release request, release: after the release)'
        required: true
        type: choice
        options: [rc, release]
      commit:
        description: 'Released commit SHA (release step only; required when no rc tag was created)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      # スクリプトと main の VERSION は、いつも main のものを使う（リリースブランチにあるものは古いことがあるため）
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # リリースブランチは、ジョブを始めた時点の先頭を、取りこぼしを確かめるためにすべての履歴つきで取る
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          path: release-work
          fetch-depth: 0
          persist-credentials: false

      # タグの作成とリリースブランチの削除はルールセットで制限しているので、例外にしている GitHub App のトークンを使う
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CHERRY_PICK_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHERRY_PICK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write # リリースしたバージョンのリリースラベルをアーカイブする
          permission-pull-requests: write # リリースしたバージョンのラベルが付いた開いている PR のラベルを付け直し、ラベルのチェックをやり直させる

      - uses: actions/github-script@v9
        env:
          STEP: ${{ inputs.step }}
          COMMIT: ${{ inputs.commit }}
          RELEASE_WORK: release-work
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { releaseCandidate, release } = require('./.github/scripts/release.js')
            await (process.env.STEP === 'rc' ? releaseCandidate : release)({ github, context, core })
