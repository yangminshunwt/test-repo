name: Tag Creation

# リリース手順を進める（開発ルールの「リリース手順」）。Use workflow from でリリースブランチを選んで実行する。
# - rc：リリース申請の前に、リリースブランチの先頭に次の rc タグ（<製品名>/vX.Y.Z-rc.N）を打つ
# - release：リリースの後に、リリースしたコミット（commit に入力したもの、なければ最後の rc）にリリースタグ（<製品名>/vX.Y.Z）を打ち、
#   リリースブランチを削除する
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Step to run (rc: before the release request, release: after the release)'
        required: true
        type: choice
        options: [rc, release]
      commit:
        description: 'Released commit SHA (release step only; leave empty to use the latest rc tag)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # App の秘密鍵は Environment（automation-app）に置き、main と release/** で動くときだけ読めるようにしている
    # （どちらも PR でしか変えられないので、PR でマージされ、必須チェックを通ったワークフローだけが秘密鍵を使える。
    # リリースブランチを作れる管理者は、そのブランチのワークフローで秘密鍵を使える）。
    # デプロイの記録は作らない（秘密鍵を読むためだけに使う）
    environment:
      name: automation-app
      deployment: false
    steps:
      # リリースブランチの今の先頭を、すべての履歴（main とほかのリリースブランチ、タグも）つきで取る。
      # スクリプトも、このブランチのものを使う（ワークフローと同じブランチのものなので、食い違わない）
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # タグの作成とリリースブランチの削除はルールセットで制限しているので、例外にしている GitHub App のトークンを使う
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write # リリースしたバージョンのリリースラベルをアーカイブする
          permission-pull-requests: read # マージされた PR の一覧を読む

      - uses: actions/github-script@v9
        env:
          STEP: ${{ inputs.step }}
          COMMIT: ${{ inputs.commit }}
        with:
          retries: 3 # GitHub API の一時的なエラー（5xx）はやり直す
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { releaseCandidate, release } = require('./.github/scripts/release.js')
            await (process.env.STEP === 'rc' ? releaseCandidate : release)({ github, context, core })
